# ============================================================================
# TPU v6e (Trillium) configuration for SCALE-Sim
# ----------------------------------------------------------------------------
# Models ONE 128x128 bf16 systolic MXU, matching the unit the TimeLinearModel=
# TPUv6e coefficients were calibrated against (see scalesim/linear_model/tpu.py
# and scalesim/linear_model/tpuv6e_coeffs.json).
#
# TPU v6e reference specs (per chip), nominal (used only for documentation; the
# linear/roofline time model is calibrated to measured v6e silicon, so it does
# not depend on these exact numbers):
#   - peak ~918 bf16 TFLOP/s
#   - HBM: ~1.6 TB/s, 32 GiB
#   - large on-chip VMEM/CMEM
#
# IMPORTANT (calibration coupling): the shipped TimeLinearModel=TPUv6e
# (scalesim/linear_model/tpu.py) maps compute cycles -> microseconds and was fit
# (G_roof) against the compute-cycle definition of a 128x128, weight-stationary,
# NON-stalling run on a real TPU v6e. Keep ArrayHeight/Width and Dataflow as
# below and keep the run compute-bound (generous SRAM + high Bandwidth), or
# re-fit the linear model. Memory stalls are modeled analytically by the
# roofline term in the linear model, not by SCALE-Sim stall cycles here.
# ============================================================================

[general]
run_name = tpuv6e_mxu_128x128_ws

[architecture_presets]
ArrayHeight:    128
ArrayWidth:     128
IfmapSramSzkB:   16384
FilterSramSzkB:  16384
OfmapSramSzkB:   16384
IfmapOffset:    0
FilterOffset:   10000000
OfmapOffset:    20000000
Bandwidth : 1024
Dataflow : ws

[layout]
IfmapCustomLayout: False
IfmapSRAMBankBandwidth: 128
IfmapSRAMBankNum: 32
IfmapSRAMBankPort: 2
FilterCustomLayout: False
FilterSRAMBankBandwidth: 128
FilterSRAMBankNum: 32
FilterSRAMBankPort: 2

[run_presets]
InterfaceBandwidth: USER
TimeLinearModel: TPUv6e
