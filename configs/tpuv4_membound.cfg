# ============================================================================
# TPU v4 configuration for SCALE-Sim
# ----------------------------------------------------------------------------
# Models ONE 128x128 bf16 systolic MXU (a TPU v4 chip = 2 TensorCores x 4 MXUs).
#
# TPU v4 reference specs (per chip), used to set the values below:
#   - 2 TensorCores, each 4x 128x128 bf16 MXUs  => 8 MXUs/chip
#   - peak ~275 bf16 TFLOP/s  =>  clock ~1.05 GHz
#         ( 275e12 / (8 MXU * 128*128 MAC * 2 FLOP/MAC) = 1.05e9 )
#   - HBM2: ~1.2 TB/s, 32 GiB
#   - large on-chip VMEM/CMEM (tens of MiB per core)
#
# HBM bandwidth in SCALE-Sim "words" (elements/cycle), bf16 = 2 B/elem:
#   chip: 1.2e12 B/s / 1.05e9 cyc/s / 2 B = ~571 elem/cyc;  core ~285;  MXU ~71
#
# IMPORTANT (calibration coupling): the shipped TimeLinearModel=TPUv4
# (scalesim/latency_model/linear_model/tpu.py) maps compute cycles -> microseconds and was
# fit against the compute-cycle definition of a 128x128, weight-stationary,
# NON-stalling run. Keep ArrayHeight/Width and Dataflow as below and keep the
# run compute-bound (generous SRAM + high Bandwidth), or re-fit the linear
# model. Memory stalls are meant to be modeled analytically by the linear/
# roofline model, not by SCALE-Sim stall cycles here.
# ============================================================================

[general]
run_name = tpuv4_membound

[architecture_presets]
ArrayHeight:    128
ArrayWidth:     128
IfmapSramSzkB:   256
FilterSramSzkB:  256
OfmapSramSzkB:   256
IfmapOffset:    0
FilterOffset:   10000000
OfmapOffset:    20000000
Bandwidth : 8
Dataflow : ws

[layout]
IfmapCustomLayout: False
IfmapSRAMBankBandwidth: 128
IfmapSRAMBankNum: 32
IfmapSRAMBankPort: 2
FilterCustomLayout: False
FilterSRAMBankBandwidth: 128
FilterSRAMBankNum: 32
FilterSRAMBankPort: 2

[run_presets]
InterfaceBandwidth: USER
TimeLinearModel: TPUv4
